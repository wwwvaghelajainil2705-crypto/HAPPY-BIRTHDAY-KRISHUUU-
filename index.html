<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday Krishuuu ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: "Poppins", sans-serif;
  background: linear-gradient(135deg, #ffdee9, #b5fffc);
  text-align: center;
}

h1 {
  color: #ff4d6d;
  margin-top: 25px;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 15px;
  padding: 20px;
  max-width: 1100px;
  margin: auto;
}

.gallery img {
  width: 100%;
  height: 300px;
  object-fit: cover;
  border-radius: 15px;
  box-shadow: 0 10px 20px rgba(0,0,0,0.2);
}

.question {
  margin: 40px;
  position: relative;
}

button {
  padding: 14px 30px;
  font-size: 1.1em;
  border: none;
  border-radius: 30px;
  cursor: pointer;
  margin: 15px;
}

#yes { background: #ff4d6d; color: white; }
#no { background: #999; color: white; position: absolute; }

#slides {
  display: none;
  min-height: 100svh;
  padding: 40px 20px;
}

.slide img {
  width: 90%;
  max-width: 400px;
  height: 420px;
  object-fit: cover;
  border-radius: 20px;
  box-shadow: 0 12px 25px rgba(0,0,0,0.25);
}

.slide p {
  font-size: 1.3em;
  margin-top: 20px;
  color: #444;
}

.nextBtn {
  margin-top: 25px;
  background: #ff4d6d;
  color: white;
}
</style>
</head>

<body>

<h1>Happy Birthday Krishuuu ❤️🎂</h1>

<div id="mainContent">

  <div class="gallery">
    <img src="images/photo1.jpg">
    <img src="images/photo2.jpg">
    <img src="images/photo3.jpg">
    <img src="images/photo4.jpg">
    <img src="images/photo5.jpg">
    <img src="images/photo6.jpg">
    <img src="images/photo7.jpg">
    <img src="images/photo8.jpg">
    <img src="images/photo9.jpg">
    <img src="images/photo10.jpg">
  </div>

  <div class="question">
    <h2>Will you stay with me forever? 🥺❤️</h2>
    <button id="yes" onclick="startSlides()">Yes</button>
    <button id="no">No</button>
  </div>

</div>

<div id="slides">
  <div class="slide">
    <img id="slideImg">
    <p id="slideText"></p>
    <button class="nextBtn" onclick="nextSlide()">Next ❤️</button>
  </div>
</div>

<script>
const slides = [
  { img: "images/photo1.jpg", text: "From the first moment, you felt like home ❤️" },
  { img: "images/photo2.jpg", text: "Every smile of yours makes my world brighter ✨" },
  { img: "images/photo3.jpg", text: "With you, even ordinary days feel special 💕" },
  { img: "images/photo4.jpg", text: "I love how perfectly imperfect we are together 🫶" },
  { img: "images/photo5.jpg", text: "You are my favorite thought every single day 🌸" },
  { img: "images/photo6.jpg", text: "No matter what comes, I choose you 💖" },
  { img: "images/photo7.jpg", text: "Your happiness means everything to me 🥰" },
  { img: "images/photo8.jpg", text: "Thank you for being my safe place ❤️" },
  { img: "images/photo9.jpg", text: "I promise to stand by you, always 🤞" },
  { img: "images/photo10.jpg", text: "Happy Birthday, my love — forever starts with us 🎂❤️" }
];

let index = 0;

function startSlides() {
  document.getElementById("mainContent").style.display = "none";
  document.getElementById("slides").style.display = "block";
  showSlide();
}

function showSlide() {
  slideImg.src = slides[index].img;
  slideText.innerText = slides[index].text;
}

function nextSlide() {
  if (index < slides.length - 1) {
    index++;
    showSlide();
  } else {
    slideText.innerText = "I love you endlessly, Krishuuu ❤️";
  }
}

const noBtn = document.getElementById("no");
function moveNo() {
  noBtn.style.left = Math.random() * (window.innerWidth - 120) + "px";
  noBtn.style.top = Math.random() * 120 + "px";
}
noBtn.addEventListener("mouseover", moveNo);
noBtn.addEventListener("touchstart", moveNo);
</script>

</body>
</html>
